site_name: Python Skeleton
site_description: Add your description here
# site_url: something

theme:
  name: shadcn
  pygments_style:
    light: github-light
    dark: github-dark

hooks:
  - docs/scripts/shadcn_autoapi.py

markdown_extensions:
  - mkdocs-click
  - codehilite:
      guess_lang: false

plugins:
  - search
  - include-markdown
  - mkdocs-autoapi:
      autoapi_dir: src
      autoapi_add_nav_entry: true
      autoapi_file_patterns:
        - "*.py"
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            show_if_no_docstring: true
            show_source: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - CLI Reference: cli.md
