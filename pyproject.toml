[project]
name = "python-skeleton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryan McKeown", email = "ryanmckeown@mail4me.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
python-skeleton = "python_skeleton:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.81",
]
