name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  release_please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
      - name: Check out the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app_token.outputs.token }}
          ref: ${{ fromJSON(steps.release.outputs.prs)[0].headBranchName }}
      - uses: ./.github/actions/environment
        if: steps.release.outputs.prs_created == 'true'
      - name: Format the generated changelog
        if: steps.release.outputs.prs_created == 'true'
        env:
          BOT_NAME: ${{ steps.app_token.outputs.app-slug }}
        run: |
          uv run --frozen rumdl fmt CHANGELOG.md
          if git diff --quiet; then
            echo "Changelog is already formatted; nothing to commit."
            exit 0
          fi
          git config user.name "$github-actions[bot]"
          git config user.email "$github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "style: format CHANGELOG.md with rumdl"
          git push
      - name: Enable auto-merge on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          pr_number="$(jq -r '.[0].number' <<< "$RELEASE_PRS")"
          gh pr merge --auto --squash "$pr_number" || true

  build_release:
    name: Build and attach distributions
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/environment
      - name: Build distributions
        run: uv build
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.release_please.outputs.tag_name }}"
          gh release upload "$tag" dist/*
