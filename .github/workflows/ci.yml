name: Continuous Integration
on: [pull_request]

permissions:
  contents: read
  code-quality: write

jobs:

  lint:
    displayName: Code lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/environment
      - name: Code linting check
        run: uv run --frozen ruff check --output-format=github .

  format:
    displayName: Code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/environment
      - name: Code formatting check
        run: uv run --frozen ruff format --diff .

  type_check:
    displayName: Code type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/environment
      - name: Code type hints check
        run: uv run --frozen ty check .

  unit_test:
    displayName: Unit test and code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/environment
      - name: Code unit tests
        run: uv run --frozen pytest --cov=. --cov-report=xml
      - name: Upload code coverage report
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest