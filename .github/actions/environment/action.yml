name: Set up environment
description: Install Python, uv, and locked dependencies

runs:
  using: composite
  steps:
  
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
    
    - name: Install Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --locked --all-extras --all-groups